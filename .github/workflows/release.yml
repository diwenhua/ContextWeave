name: Release draft
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'version=0.0.0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable version tag such as v0.1.0' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Tag must refer to a commit on main' >&2; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Build unsigned test package
        env:
          CONTEXTWEAVE_VERSION: ${{ steps.version.outputs.version }}
          CONTEXTWEAVE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-dmg.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-package
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --draft --title "$GITHUB_REF_NAME" \
            --notes 'Development preview: this macOS build is unsigned and not notarized. Gatekeeper may block it. This draft requires review before publication.'
