name: Release draft
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and submit a test DMG to Apple
        type: boolean
        default: false
      resume_run_id:
        description: Original submission run ID (leave blank to build a new DMG)
        type: string
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.resume_run_id == '')
    runs-on: macos-15
    environment: ${{ (github.event_name == 'push' || inputs.signed) && 'macos-release' || 'macos-test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'version=0.0.0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable version tag such as v0.1.0' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Tag must refer to a commit on main' >&2; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Build unsigned test package
        if: github.event_name == 'workflow_dispatch' && !inputs.signed
        env:
          CONTEXTWEAVE_VERSION: ${{ steps.version.outputs.version }}
          CONTEXTWEAVE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-dmg.sh
      - name: Sign DMG and submit to Apple
        if: github.event_name == 'push' || inputs.signed
        env:
          CONTEXTWEAVE_VERSION: ${{ steps.version.outputs.version }}
          CONTEXTWEAVE_BUILD_NUMBER: ${{ github.run_number }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          umask 077
          : "${MACOS_CERTIFICATE_BASE64:?Missing signing certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APPLE_ID:?Missing Apple ID}"
          : "${APPLE_TEAM_ID:?Missing Apple team ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing notarization password}"
          p12="$RUNNER_TEMP/contextweave.p12"
          keychain="$RUNNER_TEMP/contextweave.keychain-db"
          trap 'security delete-keychain "$keychain" || true; rm -f "$p12"' EXIT
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          export CONTEXTWEAVE_SIGNING_IDENTITY
          CONTEXTWEAVE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$keychain" |
            awk -v team="($APPLE_TEAM_ID)" '/Developer ID Application:/ && index($0, team) { print $2; exit }')
          : "${CONTEXTWEAVE_SIGNING_IDENTITY:?No matching Developer ID Application identity}"
          unset MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD
          rm -f "$p12"
          ./scripts/package-dmg.sh
          printf '%s\n' "$GITHUB_REF_NAME" > dist/notarization-pending/source-ref
          {
            echo '### DMG submitted to Apple'
            printf 'Submission ID: `%s`\n\n' "$(cat dist/notarization-pending/submission-id)"
            printf 'Run this workflow on main with resume_run_id set to `%s`.\n' "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned test package
        if: github.event_name == 'workflow_dispatch' && !inputs.signed
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-package
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
      - name: Preserve signed DMG and submission ID
        if: github.event_name == 'push' || inputs.signed
        uses: actions/upload-artifact@v4
        with:
          name: notarization-pending
          path: dist/notarization-pending/
          if-no-files-found: error

  resume:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.resume_run_id != ''
    runs-on: macos-15
    environment: macos-release
    concurrency:
      group: notarization-resume-${{ inputs.resume_run_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source run and fetch original DMG
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.resume_run_id }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Enter the numeric run ID from the original submission URL.' >&2
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/release.yml"
            and .head_repository.full_name == $repository
            and .conclusion == "success"
            and (.event == "push" or (.event == "workflow_dispatch" and .head_branch == "main"))
          ' <<< "$run" > /dev/null
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name notarization-pending --dir pending
          if [[ "$(jq -r .event <<< "$run")" == push ]]; then
            tag=$(cat pending/source-ref)
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'Expected a stable release tag in the source artifact.' >&2
              exit 1
            fi
            sha=$(jq -r .head_sha <<< "$run")
            [[ "$(git rev-parse --verify "refs/tags/$tag^{commit}")" == "$sha" ]]
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Apple status and staple if accepted
        id: finish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SOURCE_RUN: ${{ inputs.resume_run_id }}
        shell: bash
        run: |
          ./scripts/resume-notarization.sh pending dist/final
          if compgen -G 'dist/final/*.sha256' > /dev/null; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
            echo '### Apple accepted the DMG and its ticket was verified' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Apple is still reviewing the DMG\n\nResume again with run ID `%s`.\n' "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload notarized DMG
        if: steps.finish.outputs.accepted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos-package
          path: |
            dist/final/*.dmg
            dist/final/*.sha256
          if-no-files-found: error
      - name: Create draft release for the original tag
        if: steps.finish.outputs.accepted == 'true' && steps.source.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. The notarized DMG is available as a workflow artifact."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/final/*.dmg dist/final/*.sha256 \
            --draft --verify-tag --title "$RELEASE_TAG" \
            --notes 'This macOS package is signed with Developer ID and notarized by Apple. This draft requires review before publication.'
