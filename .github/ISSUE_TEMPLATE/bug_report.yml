name: Bug report
description: Report a problem
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and ContextWeave versions
  - type: markdown
    attributes:
      value: Please remove private conversations, credentials, and other sensitive information.
